<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Poolentra — Coming soon</title>
    <meta
      name="description"
      content="Poolentra, the complete pool service operating system, is coming soon for Australian pool-service businesses."
    />
    <link rel="icon" type="image/png" href="poolentra-favicon.png" />
    <style>
      :root {
        --navy: #003b88;
        --blue: #0048b3;
        --cyan: #00bbee;
        --ink: #132743;
        --muted: #52667f;
        --mist: #f2fafe;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--mist);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }
      .card {
        width: 100%;
        max-width: 640px;
        background: var(--white);
        border-radius: 20px;
        border-top: 6px solid var(--cyan);
        box-shadow: 0 18px 50px rgba(0, 59, 136, 0.12);
        padding: 48px 40px;
        text-align: center;
      }
      .logo {
        width: 100%;
        max-width: 320px;
        height: auto;
      }
      h1 {
        color: var(--navy);
        font-size: clamp(26px, 5vw, 36px);
        line-height: 1.2;
        margin: 32px 0 12px;
      }
      p {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--muted);
      }
      .soon {
        display: inline-block;
        margin: 12px 0 28px;
        padding: 8px 18px;
        border-radius: 999px;
        background: var(--navy);
        color: var(--white);
        font-weight: 700;
        font-size: 15px;
      }
      a {
        color: var(--blue);
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 3px;
      }
      footer {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        padding: 16px;
      }
      @media (max-width: 480px) {
        .card {
          padding: 36px 22px;
        }
        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img class="logo" src="poolentra-logo.png" alt="Poolentra" width="1976" height="314" />
        <h1>Your complete pool service operating system.</h1>
        <p>Coming soon for Australian pool-service businesses.</p>
        <span class="soon">Coming soon</span>
        <p>Questions? <a href="mailto:manager@poolentra.com">manager@poolentra.com</a></p>
      </div>
    </main>
    <footer>© 2026 Poolentra</footer>
  </body>
</html>
